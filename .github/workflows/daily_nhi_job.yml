name: Daily NHI and TFDA Data Synchronization

# 21:30 Taiwan time: the Taiwan self-hosted runner checks NHI while an
# independent GitHub-hosted job validates D1 and syncs TFDA.
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      tfda_only:
        description: '只執行 TFDA 供應與回收同步'
        required: false
        type: boolean
        default: false
      nhi_dry_run:
        description: '只檢查 NHI 差異與預算，不寫入 D1'
        required: false
        type: boolean
        default: false
      d1_preflight_only:
        description: '只驗證 D1 連線、資料表、索引與用量'
        required: false
        type: boolean
        default: false
      nhi_proxy_url:
        description: 'NHI Proxy 網址；留空使用正式環境'
        required: false
        type: string
        default: ''
      nhi_source_mode:
        description: 'NHI 下載來源策略'
        required: false
        type: choice
        options:
          - direct_then_proxy
          - direct
          - proxy
        default: direct_then_proxy

jobs:
  nhi-sync:
    if: ${{ github.event_name == 'schedule' || (inputs.tfda_only != true && inputs.d1_preflight_only != true) }}
    runs-on: [self-hosted, Windows, X64, nhi-taiwan]
    timeout-minutes: 90
    concurrency:
      group: nhi-daily-import
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Process NHI Data (Exclude Zero Price)
        env:
          NHI_PROXY_TOKEN: ${{ secrets.NHI_PROXY_TOKEN }}
          NHI_PROXY_URL: ${{ inputs.nhi_proxy_url || 'https://nhi-proxy.mingster.workers.dev/download' }}
          NHI_PROXY_DIAGNOSTIC: ${{ inputs.nhi_dry_run == true && '1' || '0' }}
          NHI_SOURCE_MODE: ${{ inputs.nhi_source_mode || 'direct_then_proxy' }}
        run: python process_nhi.py --exclude-zero --output cleaned_nhi_data_no_zero.csv

      - name: Upload incremental changes to Cloudflare D1
        id: nhi_upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python upload_d1.py --csv cleaned_nhi_data_no_zero.csv --report upload_report.json ${{ inputs.nhi_dry_run == true && '--dry-run' || '' }}

      - name: Add NHI synchronization report
        if: ${{ always() }}
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## NHI synchronization report'
          if (Test-Path -LiteralPath 'upload_report.json') {
            Add-Content $env:GITHUB_STEP_SUMMARY '```json'
            Get-Content -LiteralPath 'upload_report.json' | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY 'The NHI step ended before a report could be generated.'
          }

      - name: Mark deferred NHI synchronization for notification
        if: ${{ always() && (steps.nhi_upload.outputs.status == 'deferred_quota' || steps.nhi_upload.outputs.status == 'deferred_data_anomaly') }}
        shell: pwsh
        run: |
          Write-Error "NHI update deferred: ${{ steps.nhi_upload.outputs.reason }}"
          exit 1

  cloud-maintenance:
    if: ${{ github.event_name == 'schedule' || inputs.tfda_only == true || inputs.d1_preflight_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: tfda-and-d1-preflight
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        if: ${{ github.event_name == 'schedule' || inputs.d1_preflight_only == true }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        if: ${{ github.event_name == 'schedule' || inputs.d1_preflight_only == true }}
        run: pip install -r requirements.txt

      - name: Validate Cloudflare D1 guard rails
        if: ${{ github.event_name == 'schedule' || inputs.d1_preflight_only == true }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python upload_d1.py --validate-live --report upload_report.json

      - name: Sync TFDA supply and recall data
        if: ${{ always() && (github.event_name == 'schedule' || inputs.tfda_only == true) }}
        env:
          TFDA_SYNC_TOKEN: ${{ secrets.TFDA_SYNC_TOKEN }}
        run: |
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 600 \
            --request POST \
            --header "Authorization: Bearer ${TFDA_SYNC_TOKEN}" \
            https://nhidrug.mingtc.com/api/sync/tfda
